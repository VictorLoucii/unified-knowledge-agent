# docker-compose.yml
version: '3.8'

services:
  # postgres:
  #   image: postgres:15-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: password123
  #     POSTGRES_DB: postgres
  #   ports:
  #     - "5432:5432" 
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data 
  #   # Added from my version: Ensures backend waits for DB to be fully ready
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Host 8000 -> container 7860. The Dockerfile binds 7860 (Dockerfile:33),
      # so the container side must be 7860; publishing 8000:8000 reached nothing.
      - "8000:7860"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
    # No volumes. The index is baked into the image by `COPY backend/ ./backend/`
    # (.dockerignore keeps backend/chroma_db and backend/docstore in the build
    # context on purpose). The two mounts removed here named ./chroma_db and
    # ./docstore, which do not exist, and mapped them to /app/chroma_db, which
    # nothing reads — config.py:84 puts the real paths under /app/backend.
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
      args:
        # This MUST be a build arg, not an `environment:` entry. `next build`
        # (frontend.Dockerfile:30) inlines every NEXT_PUBLIC_* value into the
        # browser bundle, so a value supplied at container start arrives after
        # the bundle is already frozen and has no effect. Measured locally:
        # built with no value the bundle carries http://localhost:7860 three
        # times and localhost:8000 not at all; built with this value it carries
        # http://localhost:8000 three times and 7860 not at all.
        #
        # Host port 8000 matches the backend mapping at :31. Note this address
        # is resolved by the BROWSER, not by the frontend container, so an image
        # built this way only works where the backend is reachable on the
        # viewer's own localhost. Deploying it to a remote host needs a rebuild
        # with a different value.
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    # No `environment:` entry for NEXT_PUBLIC_API_URL. One used to sit here and
    # was inert for the reason given under `args:` above. Do not re-add it.
    depends_on:
      - backend

volumes:
  postgres_data: