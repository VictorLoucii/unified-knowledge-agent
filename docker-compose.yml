# docker-compose.yml
version: '3.8'

services:
  # postgres:
  #   image: postgres:15-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: password123
  #     POSTGRES_DB: postgres
  #   ports:
  #     - "5432:5432" 
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data 
  #   # Added from my version: Ensures backend waits for DB to be fully ready
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Host 8000 -> container 7860. The Dockerfile binds 7860 (Dockerfile:33),
      # so the container side must be 7860; publishing 8000:8000 reached nothing.
      - "8000:7860"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
    # No volumes. The index is baked into the image by `COPY backend/ ./backend/`
    # (.dockerignore keeps backend/chroma_db and backend/docstore in the build
    # context on purpose). The two mounts removed here named ./chroma_db and
    # ./docstore, which do not exist, and mapped them to /app/chroma_db, which
    # nothing reads — config.py:84 puts the real paths under /app/backend.
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data: